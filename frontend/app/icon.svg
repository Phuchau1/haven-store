<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE0AD" />
      <stop offset="35%" stop-color="#DFAC6C" />
      <stop offset="70%" stop-color="#C68B45" />
      <stop offset="100%" stop-color="#8F5D24" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="12" opacity="0.6"/>

  <!-- Luxury Monogram H for HAVEN STORE -->
  <g fill="none" stroke="url(#goldGrad)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Pillar -->
    <path d="M165 140 L165 372" stroke-width="48" />
    <!-- Right Pillar -->
    <path d="M347 140 L347 372" stroke-width="48" />
    <!-- Middle Crossbar with Diamond Accent -->
    <path d="M165 256 L347 256" stroke-width="40" />
  </g>

  <!-- Crown / Diamond Top Accent -->
  <polygon points="256,110 276,140 256,155 236,140" fill="url(#goldGrad)" />
</svg>
